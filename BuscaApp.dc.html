<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
html,body{scrollbar-width:none}html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
body{margin:0;font-family:'Urbanist',system-ui,sans-serif;color:#17171c;background:transparent}
a{color:#42424a}a:hover{color:#17171c}
.kb-key:active{background:rgba(23,23,28,0.08)!important}
.clubii-caret{animation:clubii-blink 1s steps(1) infinite}
@keyframes clubii-blink{0%{opacity:1}50%{opacity:0}}
/* wp-btn: estados do componente Button (Figma BUTTON) */
.wp-btn{-webkit-tap-highlight-color:transparent;transition:background-color 120ms ease,border-color 120ms ease,color 120ms ease,box-shadow 120ms ease}
.wp-btn *{transition:color 120ms ease,fill 120ms ease,stroke 120ms ease}
.wp-btn:focus{outline:none}
@media (hover:hover){.wp-btn--primary:not([aria-disabled="true"]):hover{background-color:#4b2bb9!important}}
.wp-btn--primary:not([aria-disabled="true"]):focus-visible{background-color:#3c2395!important;box-shadow:0 0 0 2px #b3a4e9}
.wp-btn--primary:not([aria-disabled="true"]):active{background-color:#2d1d72!important}

.wp-btn--outline:not([aria-disabled="true"]):focus-visible{border-color:#3c2395!important}
.wp-btn--outline:not([aria-disabled="true"]):focus-visible,.wp-btn--outline:not([aria-disabled="true"]):focus-visible *,.wp-btn--ghost:not([aria-disabled="true"]):focus-visible,.wp-btn--ghost:not([aria-disabled="true"]):focus-visible *{color:#3c2395!important}
.wp-btn--outline:not([aria-disabled="true"]):active{border-color:#2d1d72!important}
.wp-btn--outline:not([aria-disabled="true"]):active,.wp-btn--outline:not([aria-disabled="true"]):active *,.wp-btn--ghost:not([aria-disabled="true"]):active,.wp-btn--ghost:not([aria-disabled="true"]):active *{color:#2d1d72!important}
.wp-btn--outline:not([aria-disabled="true"]):active [stroke="#5734d9"],.wp-btn--ghost:not([aria-disabled="true"]):active [stroke="#5734d9"]{stroke:#2d1d72}
.wp-btn--outline:not([aria-disabled="true"]):active [fill="#5734d9"],.wp-btn--ghost:not([aria-disabled="true"]):active [fill="#5734d9"]{fill:#2d1d72}

<div style="position: relative; width: 360px; height: var(--wp-h, 780px); overflow: hidden; border-radius: 16px; background: #f7f6fc; font-family: 'Urbanist', system-ui, sans-serif; color: #17171c; display: flex; flex-direction: column">

<!-- Status bar + cabeçalho -->

<div style="position: relative; height: 40px">
<span style="position: absolute; left: 15.5px; top: 12px; font-size: 14px; line-height: 17px; font-weight: 600; color: #ffffff; white-space: nowrap">{{statusTime}}</span>
<div style="position: absolute; left: 168px; top: 8px; width: 24px; height: 24px; border-radius: 50%; background: #000000"></div>
<img src="./assets/8b2d4d6b48dc65bf320ab274856d6d61.svg" alt="" style="position: absolute; left: 288.668px; top: 12.918px; width: 51.582px; height: 14.164px; display: block">
</div>
<header style="position: relative; height: 72px; background: #f7f6fc; border-radius: 24px 24px 0 0">
<h1 style="position: absolute; left: 0; top: 27px; transform: translateY(-0.5px); width: 360px; margin: 0; font-size: 16px; line-height: 20px; font-weight: 600; color: #17171c; text-align: center; white-space: nowrap; pointer-events: none">Buscar no app</h1>
<a href="Home.dc.html" aria-label="Voltar" onClick="{{back}}" style="position: absolute; left: 16px; top: 16px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; text-decoration: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5734d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
</a>
</header>
</div>

<!-- Conteúdo -->
<div style="flex: 1 1 0; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; display: flex; flex-direction: column; padding-bottom: {{ui.kbPad}}px">

<!-- Campo de busca -->
<div role="search" onMouseDown="{{fieldMouseDown}}" style="position: relative; margin: 16px 16px 0; height: 48px; flex-shrink: 0; box-sizing: border-box; background: #ffffff; border: 1px solid {{ui.fieldBorder}}; border-radius: 24px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b6b6c1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 15px; top: 13px; display: block"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg>
<sc-if value="{{ui.showPlaceholder}}" hint-placeholder-val="{{ false }}">
<span aria-hidden="true" style="position: absolute; left: {{ui.placeholderLeft}}px; top: 12px; font-size: 16px; line-height: 21px; font-weight: 400; color: #b6b6c1; white-space: nowrap; pointer-events: none; transform: translateY(0.5px)">Buscar no aplicativo</span>
</sc-if>
<label for="app-busca" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar no aplicativo</label>
<input id="app-busca" ref="{{inputRef}}" type="text" inputmode="search" enterkeyhint="search" autocomplete="off" value="{{ui.query}}" onChange="{{onQuery}}" onFocus="{{onFocus}}" onBlur="{{onBlur}}" onKeyDown="{{onKey}}" style="position: absolute; left: 43px; top: 12px; width: 238px; height: 21px; margin: 0; padding: 0; border: 0; outline: none; background: transparent; font-family: inherit; font-size: 16px; line-height: 21px; font-weight: 400; color: #17171c; caret-color: transparent; transform: translateY(0.5px)">
<sc-if value="{{ui.kbOpen}}" hint-placeholder-val="{{ false }}">
<span aria-hidden="true" class="clubii-caret" style="position: absolute; left: {{ui.caretLeft}}px; top: 13px; width: 2px; height: 20px; background: #5734d9; pointer-events: none"></span>
</sc-if>
<button type="button" aria-label="Limpar busca" onClick="{{clear}}" style="position: absolute; left: 281px; top: 3px; width: 40px; height: 40px; margin: 0; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#17171c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
</button>
</div>

<!-- Resultados -->
<sc-if value="{{ui.showResultsLabel}}" hint-placeholder-val="{{ true }}">
<h2 style="margin: 16px 0 0; padding: 0 16px; font-size: 14px; line-height: 20px; font-weight: 600; color: #17171c; flex-shrink: 0">Resultados</h2>
</sc-if>

<sc-if value="{{ui.hasResults}}" hint-placeholder-val="{{ true }}">
<div style="margin: 7px 16px 16px; flex-shrink: 0; box-sizing: border-box; background: #ffffff; border: 1px solid #e5e5ea; border-radius: 12px; overflow: hidden">
<div style="margin-top: -1px">
<sc-for list="{{results}}" as="it" hint-placeholder-count="4">
<a href="{{it.href}}" data-nav="{{it.nav}}" onClick="{{it.go}}" style="position: relative; display: block; height: {{it.h}}px; text-decoration: none">
<span style="position: absolute; left: 15px; top: 18px; font-size: 14px; line-height: 17px; font-weight: 600; color: #42424a; white-space: nowrap; transform: translateY(-0.5px)">{{it.label}}</span>
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5734d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 291px; top: 16px; display: block"><path d="m9 18 6-6-6-6"></path></svg>
<sc-if value="{{it.divider}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; left: 15px; top: 51px; width: 296px; height: 1px; background: #e5e5ea"></div>
</sc-if>
</a>
</sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{ui.empty}}" hint-placeholder-val="{{ false }}">
<div style="position: relative; height: 330px; flex-shrink: 0">
<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#b6b6c1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 164px; top: 75px; display: block"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg>
<span style="position: absolute; left: 0; top: 122.5px; width: 360px; font-size: 16px; line-height: 20px; font-weight: 600; color: #42424a; text-align: center; white-space: nowrap">Nenhum resultado encontrado</span>
<span style="position: absolute; left: 0; top: 146px; width: 360px; font-size: 14px; line-height: 17px; font-weight: 400; color: #7a7a86; text-align: center; white-space: nowrap">Experimente pesquisar com outras palavra</span>
<a class="wp-btn wp-btn--ghost" href="Home.dc.html" onClick="{{back}}" style="position: absolute; left: 103px; top: 179px; width: 154px; height: 32px; box-sizing: border-box; border-radius: 16px; display: block; text-decoration: none">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5734d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 7px; top: 7px; display: block; transform: translate(-0.6px, 0.2px)"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path><path d="M3 10a2 2 0 0 1 .709-1.53l7-6a2 2 0 0 1 2.58 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
<span style="position: absolute; left: 27.36px; top: 6.5px; font-size: 14px; line-height: 17px; font-weight: 600; color: #5734d9; white-space: nowrap; transform: translateY(-0.5px)">Voltar para o início</span>
</a>
</div>
</sc-if>
</div>

<!-- Teclado do celular (aparece com a busca em foco) -->
<sc-if value="{{ui.kbOpen}}" hint-placeholder-val="{{ false }}">
<div role="group" aria-label="Teclado" onMouseDown="{{kbMouseDown}}" style="position: absolute; left: 0; bottom: 0; width: 360px; height: 244px; z-index: 6; user-select: none">
<img src="./assets/019e4127357d010dac16509e60cf779e.png" alt="" style="width: 360px; height: 244px; display: block; pointer-events: none">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="40">
<button type="button" class="kb-key" aria-label="{{k.label}}" onClick="{{k.press}}" style="position: absolute; left: {{k.x}}px; top: {{k.y}}px; width: {{k.w}}px; height: {{k.h}}px; margin: 0; padding: 0; border: 0; border-radius: 6px; background: transparent; cursor: pointer"></button>
</sc-for>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"query":{"editor":"text","default":"Holerite"},"autoFocus":{"editor":"boolean","default":false},"onBack":{"editor":null},"$preview":{"width":360,"height":780}}'>

{ label: 'Clubii', href: 'Clubii.dc.html', nav: 'push:clubii' },

var sx = this;

</script>
