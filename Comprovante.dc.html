<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
componentDidMount() {
// Relógio real: atualiza a hora da status bar quando o minuto muda
var self = this;
var proxMin = function () { var d = new Date(); return 60050 - d.getSeconds() * 1000 - d.getMilliseconds(); };
var tick = function () { var d = new Date(); self.setState({ clockK: d.getHours() * 60 + d.getMinutes() }); self._clockT = setTimeout(tick, proxMin()); };
// Relógio da status bar: acorda só na virada de cada minuto (em vez de checar a cada segundo)
this._clockT = setTimeout(tick, proxMin());
}
componentWillUnmount() { clearTimeout(this._clockT); }
renderVals() {
var _d = new Date();
var statusTime = _d.getHours() + ':' + ('0' + _d.getMinutes()).slice(-2);
// Dados da última marcação (gravados pelo Início ao registrar o ponto); sem marcação, mostra o exemplo do Figma
var m = null;
try { m = JSON.parse(window.sessionStorage.getItem('wiipo.comprovante') || 'null'); } catch (e1) {}
if (!m) { try { var wn = JSON.parse(window.name || '{}'); if (wn && wn.comprovante) m = wn.comprovante; } catch (e2) {} }
m = m || { data: '29/08/2026', hora: '18:59', fuso: 'GMT -03:00' };
return {
statusTime: statusTime,
m: {
data: m.data,
hora: m.hora,
fuso: m.fuso,
id: 'MkidfjOIH4564kgIUHFDA64MkidfjOIH4564kgIUHFDA64MkidfjOIH4564kgIUHFDA64MkidfjOIH4564kgIUHFDA64MkidfjOIH4564kgIUHFDA6=='
}
};
}
}
