<script type="text/x-dc" data-dc-script data-props='{"estado":{"editor":"enum","default":"padrao","options":["padrao","download","compartilhar"]},"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
componentDidMount() {
var self = this;
var proxMin = function () { var d = new Date(); return 60050 - d.getSeconds() * 1000 - d.getMilliseconds(); };
var tick = function () { var d = new Date(); self.setState({ clockK: d.getHours() * 60 + d.getMinutes() }); self._clockT = setTimeout(tick, proxMin()); };
// Relógio da status bar: acorda só na virada de cada minuto (em vez de checar a cada segundo)
this._clockT = setTimeout(tick, proxMin());
}
componentWillUnmount() { clearTimeout(this._clockT); clearTimeout(this._toastT); clearTimeout(this._fimT); }
estadoAtual() {
var est = this.props.estado || 'padrao';
return Object.assign({ toast: est === 'download' ? 'on' : null, share: est === 'compartilhar' ? 'on' : null, rolagem: 0 }, this.state || {});
}
renderVals() {
var _d = new Date();
var statusTime = _d.getHours() + ':' + ('0' + _d.getMinutes()).slice(-2);
var me = this;
var st = this.estadoAtual();
// Informe aberto na lista (ano e empresa); sem seleção, o do ano anterior da Senior Sistemas
var doc = null;
try { doc = JSON.parse(window.sessionStorage.getItem('wiipo.demonstrativo') || 'null'); } catch (e) {}
doc = doc || { ano: new Date().getFullYear() - 1, empresa: 'Senior Sistemas' };
if (!this._h) {
var fechar = function (campo) {
var o = {}; o[campo] = 'saindo'; me.setState(o);
clearTimeout(me._fimT);
me._fimT = setTimeout(function () { var o2 = {}; o2[campo] = null; me.setState(o2); }, 260);
};
this._h = {
baixar: function () {
clearTimeout(me._toastT); clearTimeout(me._fimT);
me.setState({ toast: 'on', share: null });
// Alerta breve: some sozinho depois de alguns segundos
me._toastT = setTimeout(function () { fechar('toast'); }, 3200);
},
fecharToast: function () { clearTimeout(me._toastT); fechar('toast'); },
compartilhar: function () { clearTimeout(me._fimT); me.setState({ share: 'on', toast: null }); },
fecharShare: function () { fechar('share'); },
onScroll: function (e) { var el = e.currentTarget; me.setState({ rolagem: el.scrollTop / Math.max(1, el.scrollHeight - el.clientHeight) }); }
};
}
var H = this._h;
var saindoT = st.toast === 'saindo', saindoS = st.share === 'saindo';
return {
statusTime: statusTime,
baixar: H.baixar, fecharToast: H.fecharToast, compartilhar: H.compartilhar, fecharShare: H.fecharShare, onScroll: H.onScroll,
doc: { ano: doc.ano, empresa: doc.empresa, arquivo: 'informe-rendimentos-' + doc.ano + '.pdf' },
ui: {
thumbR: Math.min(1, Math.max(0, st.rolagem || 0)),
thumbTop: Math.round(Math.min(1, Math.max(0, st.rolagem || 0)) * (552 - 200) * 100) / 100,
toast: !!st.toast, share: !!st.share,
toastAnim: saindoT ? 'demToastOut 240ms ease both' : 'demToastIn 280ms cubic-bezier(0.22, 0.8, 0.26, 1) both',
veuAnim: saindoT ? 'demFadeOut 240ms ease both' : 'demFadeIn 200ms ease both',
veuAnim2: saindoS ? 'demFadeOut 240ms ease both' : 'demFadeIn 200ms ease both',
sheetAnim: saindoS ? 'demSheetOut 240ms cubic-bezier(0.32, 0, 0.24, 1) both' : 'demSheetIn 300ms cubic-bezier(0.22, 0.8, 0.26, 1) both'
}
};
}
}
</script>
