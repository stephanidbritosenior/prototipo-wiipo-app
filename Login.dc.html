<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
componentDidMount() {
var self = this;
var proxMin = function () { var d = new Date(); return 60050 - d.getSeconds() * 1000 - d.getMilliseconds(); };
var tick = function () { var d = new Date(); self.setState({ clockK: d.getHours() * 60 + d.getMinutes() }); self._clockT = setTimeout(tick, proxMin()); };
// Relógio da status bar: acorda só na virada de cada minuto (em vez de checar a cada segundo)
this._clockT = setTimeout(tick, proxMin());
}
componentWillUnmount() { clearTimeout(this._clockT); }
renderVals() {
var _d = new Date();
return { statusTime: _d.getHours() + ':' + ('0' + _d.getMinutes()).slice(-2) };
}
}
