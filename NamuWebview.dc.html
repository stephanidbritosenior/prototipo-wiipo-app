<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Namu (webview)</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
<script src="./assets/006b9949ae9e16e15b7586c26de23cca.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
html,body{scrollbar-width:none}html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
body{margin:0;font-family:'Urbanist',system-ui,sans-serif;color:#17171c;background:transparent}
a{color:#42424a}a:hover{color:#17171c}
</style>
</helmet>
<div style="position: relative; width: 360px; height: var(--wp-h, 780px); overflow: hidden; border-radius: 16px; background: #ffffff; font-family: 'Urbanist', system-ui, sans-serif; color: #17171c; display: flex; flex-direction: column">

<!-- Status bar + cabeçalho da webview -->
<div style="background: linear-gradient(180deg, #211551 0, #211551 64px, #f7f6fc 64px); display: flex; flex-direction: column; flex-shrink: 0">
<div style="position: relative; height: 40px">
<span style="position: absolute; left: 15.5px; top: 12px; font-size: 14px; line-height: 17px; font-weight: 600; color: #ffffff; white-space: nowrap">{{statusTime}}</span>
<div style="position: absolute; left: 168px; top: 8px; width: 24px; height: 24px; border-radius: 50%; background: #000000"></div>
<img src="./assets/8b2d4d6b48dc65bf320ab274856d6d61.svg" alt="" style="position: absolute; left: 288.668px; top: 12.918px; width: 51.582px; height: 14.164px; display: block">
</div>
<header style="position: relative; height: 64px; background: #f7f6fc; border-radius: 24px 24px 0 0">
<a href="Home.dc.html" data-nav="back" aria-label="Fechar" style="position: absolute; left: 16px; top: 12px; width: 40px; height: 40px; display: block; text-decoration: none">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5734d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 10px; top: 10px; display: block"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>
</a>
<span style="position: absolute; left: 0; top: 22px; width: 360px; font-size: 16px; line-height: 20px; font-weight: 600; color: #17171c; text-align: center; white-space: nowrap; pointer-events: none">Namu</span>
</header>
</div>

<!-- Páginas do Namu (capturas do app Namu, 358 px → 360 px). A app-bar e a nav-bar da captura ficam fixas; só o meio rola. Abre na página tocada na Home; a nav-bar (Início, Aulas, Namu Pass), os cards VitalScan e Namu Pass e o "VER MAIS" de Sugestões de alimentação do Início, e a seta "<" de Alimentação e VitalScan trocam de página. O resto fica estático -->
<div style="flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; background: #ffffff">
<div style="position: relative; flex-shrink: 0; height: {{pg.topH}}px; overflow: hidden; z-index: 2">
<img src="{{pg.img}}" alt="{{pg.alt}}" style="position: absolute; left: 0; top: 0; display: block; width: 360px; height: {{pg.h}}px">
<sc-for list="{{pg.topLinks}}" as="l" hint-placeholder-count="1">
<a href="#" data-nav="" onClick="{{l.go}}" aria-label="{{l.label}}" style="position: absolute; left: {{l.x}}px; top: {{l.y}}px; width: {{l.w}}px; height: {{l.h}}px; display: block; -webkit-tap-highlight-color: transparent"></a>
</sc-for>
</div>
<div ref="{{scRef}}" style="flex: 1 1 0; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none">
<div style="position: relative; width: 360px; height: {{pg.midH}}px">
<sc-for list="{{pg.segs}}" as="g" hint-placeholder-count="1">
<div style="position: absolute; left: 0; top: {{g.top}}px; width: 360px; height: {{g.h}}px; overflow: hidden"><img src="{{pg.img}}" alt="" style="position: absolute; left: 0; top: {{g.src}}px; display: block; width: 360px; height: {{pg.h}}px"></div>
</sc-for>
<sc-for list="{{pg.midLinks}}" as="l" hint-placeholder-count="3">
<a href="#" data-nav="" onClick="{{l.go}}" aria-label="{{l.label}}" style="position: absolute; left: {{l.x}}px; top: {{l.y}}px; width: {{l.w}}px; height: {{l.h}}px; display: block; -webkit-tap-highlight-color: transparent"></a>
</sc-for>
</div>
</div>
<div style="position: relative; flex-shrink: 0; height: {{pg.navH}}px; overflow: hidden">
<img src="{{pg.img}}" alt="" style="position: absolute; left: 0; top: {{pg.navSrc}}px; display: block; width: 360px; height: {{pg.h}}px">
<sc-for list="{{pg.navLinks}}" as="l" hint-placeholder-count="3">
<a href="#" data-nav="" onClick="{{l.go}}" aria-label="{{l.label}}" style="position: absolute; left: {{l.x}}px; top: {{l.y}}px; width: {{l.w}}px; height: {{l.h}}px; display: block; -webkit-tap-highlight-color: transparent"></a>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"pagina":{"editor":"enum","default":"inicio","options":["inicio","aulas","alimentacao","vitalscan","pass"]},"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
componentDidMount() {
// Relógio real: atualiza a hora da status bar quando o minuto muda
var self = this;
var proxMin = function () { var d = new Date(); return 60050 - d.getSeconds() * 1000 - d.getMilliseconds(); };
var tick = function () { var d = new Date(); self.setState({ clockK: d.getHours() * 60 + d.getMinutes() }); self._clockT = setTimeout(tick, proxMin()); };
// Relógio da status bar: acorda só na virada de cada minuto (em vez de checar a cada segundo)
this._clockT = setTimeout(tick, proxMin());
}
componentWillUnmount() { clearTimeout(this._clockT); }
renderVals() {
var _d = new Date();
var me = this;
var K = 360 / 358;
var TABS = [['Início', 0, 'inicio'], ['Aulas', 2, 'aulas'], ['Namu Pass', 3, 'pass']];
// Na captura original (358 px): top = altura da app-bar (com a sombra), nav = [início, fim] da nav-bar, segs = trechos do meio [de, até]
// (a captura do Namu Pass é emendada: o trecho 748–873 repete o que vem antes e traz uma nav-bar no meio, então fica de fora).
// links: [x, y, largura, altura, página, rótulo] em coordenadas da captura; os da nav-bar vêm das abas
var PAGES = {
inicio: { img: './assets/e66cb6ecc661814e053ac7846b8920c9.jpg', w: 358, h: 5435, alt: 'Namu — Início', top: 65, nav: [5360, 5435], segs: [[65, 5360]], links: [[20, 137, 320, 107, 'vitalscan', 'Namu VitalScan'], [20, 576, 320, 152, 'pass', 'Namu Pass'], [268, 2748, 76, 32, 'alimentacao', 'Sugestões de alimentação — Ver mais']] },
aulas: { img: './assets/6f13a0e8fd40809b8239e1951211016c.jpg', w: 358, h: 3746, alt: 'Namu — Aulas', top: 65, nav: [3671, 3746], segs: [[65, 3671]], links: [] },
alimentacao: { img: './assets/957ef974d52d963fc466b187f6ebfa33.jpg', w: 358, h: 4920, alt: 'Namu — Sugestões de alimentação', top: 50, nav: null, segs: [[50, 4920]], links: [[0, 0, 56, 48, 'inicio', 'Voltar']] },
vitalscan: { img: './assets/f49c0ba720eb0fe9962af14f7f089367.jpg', w: 360, h: 874, alt: 'Namu VitalScan — Scanner', top: 52, nav: null, segs: [[52, 874]], links: [[0, 0, 56, 52, 'inicio', 'Voltar']] },
pass: { img: './assets/c34d78de79ef3a5e1c2519332a1396e2.jpg', w: 358, h: 1727, alt: 'Namu Pass', top: 65, nav: [1652, 1727], segs: [[65, 748], [873, 1652]], links: [] }
};
// Página inicial: vem do link tocado na Home (o App grava data-namu em sessionStorage "wiipo.namu"); no artboard isolado, do Tweak "pagina"
if (this._pag === undefined) {
var v = null;
try { v = sessionStorage.getItem('wiipo.namu'); } catch (e) {}
this._pag = PAGES[v] ? v : (PAGES[this.props.pagina] ? this.props.pagina : 'inicio');
}
var nome = (this.state && this.state.pag) || this._pag;
var p = PAGES[nome];
var k = 360 / p.w;
var r2 = function (n) { return Math.round(n * k * 100) / 100; };
if (!this._go) this._go = {};
var go = function (dest) {
if (!me._go[dest]) me._go[dest] = function (e) { if (e && e.preventDefault) e.preventDefault(); me.setState({ pag: dest }); if (me._sc) me._sc.scrollTop = 0; };
return me._go[dest];
};
var mk = function (x, y, w, h, dest, label) { return { x: r2(x), y: r2(y), w: r2(w), h: r2(h), go: go(dest), label: label }; };
// trechos do meio, empilhados
var segs = [], acc = 0;
p.segs.forEach(function (sg) { segs.push({ from: sg[0], to: sg[1], at: acc }); acc += sg[1] - sg[0]; });
var topLinks = [], midLinks = [];
p.links.forEach(function (l) {
if (l[1] + l[3] <= p.top) { topLinks.push(mk(l[0], l[1], l[2], l[3], l[4], l[5])); return; }
segs.forEach(function (sg) { if (l[1] >= sg.from && l[1] < sg.to) midLinks.push(mk(l[0], l[1] - sg.from + sg.at, l[2], l[3], l[4], l[5])); });
});
var navLinks = p.nav ? TABS.map(function (t) { return mk(t[1] * 71.6, 0, 71.6, p.nav[1] - p.nav[0], t[2], t[0]); }) : [];
if (!this._scRef) this._scRef = function (el) { me._sc = el; };
return {
statusTime: _d.getHours() + ':' + ('0' + _d.getMinutes()).slice(-2),
scRef: this._scRef,
pg: { img: p.img, alt: p.alt, h: r2(p.h), topH: r2(p.top), midH: r2(acc), navH: p.nav ? r2(p.nav[1] - p.nav[0]) : 0, navSrc: p.nav ? -r2(p.nav[0]) : 0,
segs: segs.map(function (sg) { return { top: r2(sg.at), h: r2(sg.to - sg.from), src: -r2(sg.from) }; }), topLinks: topLinks, midLinks: midLinks, navLinks: navLinks }
};
}
}
</script>
</body>
</html>
