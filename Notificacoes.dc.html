class Component extends DCLogic {
notifStore() {
// Central de notificações compartilhada pelas telas (Início, Notificações): lista, não lidas e avisos de mudança
var wiipoNotif = function () {
if (window.__wiipoNotif) return window.__wiipoNotif;
var hoje = new Date();
var p2 = function (n) { return ('0' + n).slice(-2); };
var dia = function (off) { var x = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate() - off); return p2(x.getDate()) + '/' + p2(x.getMonth() + 1) + '/' + x.getFullYear(); };
var MESES = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
var mesAnt = new Date(hoje.getFullYear(), hoje.getMonth() - 1, 1);
var seq = 0;
var item = function (titulo, texto, off, nova) { seq += 1; return { id: 'n' + seq, titulo: titulo, texto: texto, data: dia(off), nova: !!nova }; };
var store = {
items: [
item('Seu holerite chegou!', 'O holerite de ' + MESES[mesAnt.getMonth()] + '/' + mesAnt.getFullYear() + ' já está disponível para consulta no app.', 0, true),
item('Novo benefício no Clubii', 'Agora você tem acesso ao Edutivo: cursos e trilhas para o seu desenvolvimento profissional.', 2, true),
item('Pesquisa de clima', 'Olá, Fulano Ciclano. Este é o questionário do Moods para você responder', 3, true),
item('Novo valor disponível no seu Flex', 'Carga de ' + MESES[hoje.getMonth()] + '/' + hoje.getFullYear() + ' chegou no seu Wiipo Flex!', 4, true),
item('Compra aprovada!', 'Sua compra em Casa Express de R$50,00 foi aprovada e debitada do bolso Food', 6, false),
item('Compra aprovada!', 'Sua compra em Giassi de R$200,00 foi aprovada e debitada do bolso Food', 6, false),
item('Passe no voucher', 'Em estabelecimentos de alimentação e refeição, passe no voucher com a sua via física do Wiipo Flex', 9, false)
],
subs: [],
naoLidas: function () { return store.items.filter(function (i) { return i.nova; }).length; },
emit: function () { store.subs.slice().forEach(function (fn) { try { fn(); } catch (e) {} }); },
marcarTodasLidas: function () { var mudou = false; store.items.forEach(function (i) { if (i.nova) { i.nova = false; mudou = true; } }); if (mudou) store.emit(); },
adicionar: function (titulo, texto) { store.items.unshift(item(titulo, texto, 0, true)); store.emit(); },
assinar: function (fn) { store.subs.push(fn); return function () { store.subs = store.subs.filter(function (f) { return f !== fn; }); }; }
};
window.__wiipoNotif = store;
return store;
};

}
componentDidMount() {
// Relógio real: atualiza a hora da status bar quando o minuto muda
var self = this;
var proxMin = function () { var d = new Date(); return 60050 - d.getSeconds() * 1000 - d.getMilliseconds(); };
var tick = function () { var d = new Date(); self.setState({ clockK: d.getHours() * 60 + d.getMinutes() }); self._clockT = setTimeout(tick, proxMin()); };
// Relógio da status bar: acorda só na virada de cada minuto (em vez de checar a cada segundo)
this._clockT = setTimeout(tick, proxMin());
// Ao abrir a tela, todas as notificações passam a contar como lidas (o badge some do Início)
this.notifStore().marcarTodasLidas();
}
componentWillUnmount() { clearTimeout(this._clockT); }
renderVals() {
var _d = new Date();
var statusTime = _d.getHours() + ':' + ('0' + _d.getMinutes()).slice(-2);
// Nesta visita mostra como estavam ao abrir (não lidas destacadas); na próxima já aparecem lidas
if (!this._snap) { this._snap = this.notifStore().items.map(function (i) { return { id: i.id, titulo: i.titulo, texto: i.texto, data: i.data, nova: i.nova }; }); }
var lista = this.props.estado === 'vazio' ? [] : this._snap;
var itens = lista.map(function (i, k) {
return { titulo: i.titulo, texto: i.texto, data: i.data, nova: i.nova, divisor: k > 0, pt: k > 0 ? 16 : 15, peso: i.nova ? 600 : 400, cor: i.nova ? '#17171c' : '#42424a' };
});
return { statusTime: statusTime, itens: itens, temItens: itens.length > 0, vazio: itens.length === 0 };
}
}
