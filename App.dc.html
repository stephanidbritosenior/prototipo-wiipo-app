/* Mockup do celular no Play: tela com largura fixa de 360 px; a altura acompanha a janela para o aparelho inteiro caber (100vh − 2×12 px de palco − 2×12 px de moldura), entre 500 e 780 px. As telas usam var(--wp-h, 780px). */
.wp-phone{--wp-h:clamp(500px,calc(100vh - 48px),780px)}
a{color:#42424a}a:hover{color:#17171c}
@keyframes wpPushIn{from{transform:translate3d(100%,0,0)}to{transform:translate3d(0,0,0)}}
@keyframes wpPushUnder{from{transform:translate3d(0,0,0)}to{transform:translate3d(-28%,0,0)}}
@keyframes wpPopOut{from{transform:translate3d(0,0,0)}to{transform:translate3d(100%,0,0)}}
@keyframes wpPopUnder{from{transform:translate3d(-28%,0,0)}to{transform:translate3d(0,0,0)}}
@keyframes wpFadeIn{from{opacity:0}to{opacity:1}}
@keyframes wpScrimIn{from{opacity:0}to{opacity:1}}
@keyframes wpScrimOut{from{opacity:1}to{opacity:0}}
@keyframes wpSheetIn{from{transform:translate3d(0,100%,0)}to{transform:translate3d(0,0,0)}}
@keyframes wpSheetOut{from{transform:translate3d(0,0,0)}to{transform:translate3d(0,100%,0)}}
@keyframes wpSplashOut{from{opacity:1}to{opacity:0}}
</style>
</helmet>
