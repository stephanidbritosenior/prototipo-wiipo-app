</sc-if>

<input id="sara-msg" ref="{{inputRef}}" type="text" enterkeyhint="send" autocomplete="off" value="{{ui.draft}}" onChange="{{onDraft}}" onFocus="{{onFocus}}" onBlur="{{onBlur}}" onKeyDown="{{onKey}}" style="position: absolute; left: 15px; top: 12px; transform: translateY(0.5px); width: 262px; height: 21px; margin: 0; padding: 0; border: 0; outline: none; background: transparent; font-family: inherit; font-size: 16px; line-height: 21px; font-weight: 400; color: #17171c; caret-color: transparent">
<sc-if value="{{ui.kbOpen}}" hint-placeholder-val="{{ false }}">

</sc-if>

</div>

</sc-for>
</div>
</sc-if>
</div>
