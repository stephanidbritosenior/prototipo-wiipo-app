<script type="text/x-dc" data-dc-script data-props='{"estado":{"editor":"enum","default":"padrao","options":["padrao","filtrarAno","filtrarEmpresa","empresaUnica","vazio"]},"$preview":{"width":360,"height":780}}'>
class Component extends DCLogic {
componentDidMount() {
var self = this;
var proxMin = function () { var d = new Date(); return 60050 - d.getSeconds() * 1000 - d.getMilliseconds(); };
var tick = function () { var d = new Date(); self.setState({ clockK: d.getHours() * 60 + d.getMinutes() }); self._clockT = setTimeout(tick, proxMin()); };
// Relógio da status bar: acorda só na virada de cada minuto (em vez de checar a cada segundo)
this._clockT = setTimeout(tick, proxMin());
}
componentWillUnmount() { clearTimeout(this._clockT); }
dados() {
// Informes de rendimento do protótipo: do ano atual até 2024.
// O colaborador entrou na Senior Sistemas em 2025 e saiu da WEG em 2025; no ano atual só há a Senior (filtro de empresa desabilitado).
var atual = new Date().getFullYear();
var anos = [];
for (var y = atual; y >= 2024; y--) {
var emp = [];
if (y >= 2025) emp.push('Senior Sistemas');
if (y <= 2025) emp.push('WEG');
anos.push({ ano: y, empresas: emp });
}
if (this.props.estado === 'vazio') anos.forEach(function (a) { a.empresas = []; });
return anos;
}
estadoAtual() {
var est = this.props.estado || 'padrao';
var anos = this.dados();
// Abre sempre no ano mais recente (o Tweak "filtrarEmpresa" mostra um ano com mais de uma empresa)
var ano = (est === 'filtrarEmpresa' && anos[1]) ? anos[1].ano : anos[0].ano;
return Object.assign({ ano: ano, empresa: 'Todos', lista: est === 'filtrarAno' ? 'ano' : (est === 'filtrarEmpresa' ? 'empresa' : null), listaY: 0 }, this.state || {});
}
renderVals() {
var _d = new Date();
var statusTime = _d.getHours() + ':' + ('0' + _d.getMinutes()).slice(-2);
var me = this;
var st = this.estadoAtual();
var anos = this.dados();
var info = anos.filter(function (a) { return a.ano === st.ano; })[0] || anos[0];
var empresas = info.empresas;
var unica = empresas.length <= 1;
var empSel = unica ? (empresas[0] || 'Todos') : (empresas.indexOf(st.empresa) >= 0 ? st.empresa : 'Todos');
var mostrar = empresas.filter(function (e) { return empSel === 'Todos' || e === empSel; });
if (!this._h) {
this._h = {
toggleAno: function () { var s0 = me.estadoAtual(); me.setState({ lista: s0.lista === 'ano' ? null : 'ano', listaY: 0 }); },
toggleEmp: function () {
var s0 = me.estadoAtual(), a0 = me.dados().filter(function (a) { return a.ano === s0.ano; })[0];
if (!a0 || a0.empresas.length <= 1) return;
me.setState({ lista: s0.lista === 'empresa' ? null : 'empresa', listaY: 0 });
},
fechar: function () { me.setState({ lista: null }); },
onListaScroll: function (e) { var el = e.currentTarget; me.setState({ listaY: el.scrollTop, listaMax: Math.max(1, el.scrollHeight - el.clientHeight) }); }
};
this._esc = {};
}
var H = this._h;
var guardar = function (ano, emp) { try { window.sessionStorage.setItem('wiipo.demonstrativo', JSON.stringify({ ano: ano, empresa: emp })); } catch (e) {} };
var demos = mostrar.map(function (e, i) {
var k = 'd' + info.ano + e;
if (!me._esc[k]) me._esc[k] = function () { guardar(info.ano, e); };
return { titulo: 'Demonstrativo ' + info.ano, empresa: e, top: i * 72 - 1, divisor: i < mostrar.length - 1, abrir: me._esc[k] };
});
var temDemo = demos.length > 0;
var listaH = demos.length * 72;
var irTop = temDemo ? 80 + listaH + 16 : 297;
// ---------- Lista suspensa ----------
var dd = { aria: '', left: 16, w: 111, h: 0, itemW: 79, conteudoH: 0, itens: [], barra: false, barraLeft: 95, trilhoH: 0, thumbTop: 0 };
if (st.lista === 'ano') {
dd.aria = 'Ano'; dd.left = 16; dd.w = 111; dd.itemW = 79; dd.barraLeft = 95;
dd.itens = anos.map(function (a, i) {
var sel = a.ano === info.ano, k = 'a' + a.ano;
if (!me._esc[k]) me._esc[k] = function () { me.setState({ ano: a.ano, empresa: 'Todos', lista: null }); };
return { label: String(a.ano), sel: sel, aria: sel ? 'true' : 'false', top: 8 + i * 36, bg: sel ? '#5734d9' : 'transparent', radio: sel ? '#ffffff' : '#7a7a86', cor: sel ? '#ffffff' : '#42424a', escolher: me._esc[k] };
});
} else if (st.lista === 'empresa' && !unica) {
dd.aria = 'Empresa'; dd.left = 135; dd.w = 209; dd.itemW = 193; dd.barraLeft = 193;
dd.itens = ['Todos'].concat(empresas).map(function (e, i) {
var sel = e === empSel, k = 'e' + e;
if (!me._esc[k]) me._esc[k] = function () { me.setState({ empresa: e, lista: null }); };
return { label: e, sel: sel, aria: sel ? 'true' : 'false', top: 8 + i * 36, bg: sel ? '#5734d9' : 'transparent', radio: sel ? '#ffffff' : '#7a7a86', cor: sel ? '#ffffff' : '#42424a', escolher: me._esc[k] };
});
}
var n = dd.itens.length;
dd.conteudoH = 8 + n * 36 - 4 + 8;
dd.h = Math.min(192, dd.conteudoH);
dd.barra = dd.conteudoH > 192;
dd.trilhoH = dd.h - 32;
var maxY = st.listaMax || Math.max(1, dd.conteudoH - dd.h);
dd.thumbTop = dd.barra ? Math.round(((st.listaY || 0) / maxY) * (dd.trilhoH - 40) * 100) / 100 : 0;
var aberta = n > 0;
return {
statusTime: statusTime,
toggleAno: H.toggleAno, toggleEmp: H.toggleEmp, fechar: H.fechar, onListaScroll: H.onListaScroll,
ui: {
ano: String(info.ano), anoAria: st.lista === 'ano' ? 'true' : 'false', anoBorda: st.lista === 'ano' ? '#5734d9' : '#e5e5ea', anoRot: st.lista === 'ano' ? 180 : 0,
empresa: empSel, empAria: st.lista === 'empresa' ? 'true' : 'false', empDisAria: unica ? 'true' : 'false',
empBg: unica ? '#f3f3f6' : '#ffffff', empBorda: (st.lista === 'empresa' && !unica) ? '#5734d9' : '#e5e5ea', empCursor: unica ? 'default' : 'pointer',
empCor: unica ? '#b6b6c1' : '#17171c', empCorLbl: unica ? '#b6b6c1' : '#7a7a86', empChev: unica ? '#b6b6c1' : '#42424a', empRot: (st.lista === 'empresa' && !unica) ? 180 : 0,
temDemo: temDemo, vazio: !temDemo, listaAberta: aberta
},
L: { listaH: listaH, irTop: irTop, contentH: irTop + 114 + 24 },
demos: demos,
dd: dd
};
}
}
</script>
